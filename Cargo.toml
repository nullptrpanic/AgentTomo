[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "fallible_uint"] }
sse-parse = "0.1.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
httparse = "1.10.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
moka = { version = "0.12.16", features = ["sync"] }
psl = "2.1.248"
time = "0.3.55"
x509-parser = "0.18.1"
zstd = { version = "0.14.3", default-features = false }
nix = { version = "0.31.3", features = ["fs", "ioctl", "process", "ptrace", "signal", "socket", "term", "uio", "user"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls-native-certs = "0.8.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio-util = { version = "0.7.20", features = ["rt"] }
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
